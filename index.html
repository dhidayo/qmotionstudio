<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Turn photos into motion. Everything renders on your device — nothing is uploaded." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Matches the dark shell, so an installed window has no bright seam. -->
    <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <title>Motion Studio</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('ms.theme');
        const theme = stored ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
